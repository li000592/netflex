      .nl-wrap, #nl-card, #nl-badge, [class*="nl-"], [aria-label*="Netlify"], iframe[id*="netlify"], iframe[src*="netlify"] {
        display: none !important;

        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
    <script>
      const cleanNetlifyBadge = () => {
        document.querySelectorAll('.nl-wrap, #nl-card, #nl-badge, [class*="nl-"]').forEach(el => el.remove());
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', cleanNetlifyBadge);
      } else {
        cleanNetlifyBadge();
      }
      try {
        new MutationObserver((mutations) => {
          for (const m of mutations) {
            for (const node of m.addedNodes) {
              if (node.nodeType === 1 && (node.classList?.contains('nl-wrap') || node.id === 'nl-badge' || node.id === 'nl-card' || node.getAttribute?.('class')?.includes('nl-'))) {
                node.remove();
              }
            }
          }
        }).observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) {}
    </script>
